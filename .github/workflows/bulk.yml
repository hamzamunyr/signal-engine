name: bulk backfill + 2-GPU scoring (manual)
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "space separated: workable reddit hn"
        default: "workable reddit hn"
      collect:
        type: boolean
        default: true
env:
  SUPABASE_REF: ${{ vars.SUPABASE_REF }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
jobs:
  collect:
    if: ${{ inputs.collect }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m engine bulk ${{ inputs.sources }}
  score:
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1] }
    env:
      LLM_SHARDS: "2"
      LLM_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m engine score
