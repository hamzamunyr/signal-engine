name: daily (jobs, reviews, LLM scoring, export)
on:
  schedule:
    - cron: "10 21 * * *"   # 02:10 Pakistan time; scored leads ready by early morning
  workflow_dispatch:
    inputs:
      skip_collect: { description: "Skip collectors (score + export only)", type: boolean, default: false }
concurrency: { group: engine-daily, cancel-in-progress: false }
env:
  SUPABASE_REF: ${{ vars.SUPABASE_REF }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  SHEET_WEBHOOK: ${{ secrets.SHEET_WEBHOOK }}
  SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
  KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - if: ${{ !inputs.skip_collect }}
        run: python -m engine collect daily
      - run: python -m engine match
      - name: LLM scoring on Kaggle (Lane B)
        run: |
          python -m engine score-push
          python -m engine score-pull
      - run: python -m engine resolve
      - run: python -m engine export
      - run: python -m engine health
